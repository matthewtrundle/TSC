<!DOCTYPE html>
<!-- Source for public/og-card.png (1200x630). Render: headless Chrome
     print/screenshot at 1200x630 viewport. Center-safe design: the full
     lockup fits the middle 630px square so Google's square thumbnail crop
     never clips it (adopted 2026-08-11). -->
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Libre+Franklin:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,500&display=swap');
  * { margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #1C242C;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lockup { text-align: center; }
  .display {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    font-size: 64px;
    line-height: 1.08;
    letter-spacing: 0.05em;
    color: #F7F4EF;
  }
  .rule {
    width: 240px;
    height: 3px;
    background: #C9A96A;
    margin: 22px auto 20px;
  }
  .sub {
    font-family: 'Libre Franklin', sans-serif;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: 0.34em;
    padding-left: 0.34em;
    color: #C9A96A;
  }
  .tagline {
    font-family: 'Source Serif 4', serif;
    font-weight: 500;
    font-size: 23px;
    color: rgba(247, 244, 239, 0.78);
    margin-top: 44px;
  }
  .phone {
    font-family: 'Libre Franklin', sans-serif;
    font-weight: 500;
    font-size: 19px;
    letter-spacing: 0.04em;
    color: rgba(247, 244, 239, 0.6);
    margin-top: 12px;
  }
</style>
</head>
<body>
  <div class="lockup">
    <div class="display">THE SURGERY</div>
    <div class="display">CENTER</div>
    <div class="rule"></div>
    <div class="sub">PLANO DERMATOLOGY</div>
    <div class="tagline">Fellowship-Trained Mohs Surgery &middot; Plano, Texas</div>
    <div class="phone">(972) 378-0620</div>
  </div>
</body>
</html>
